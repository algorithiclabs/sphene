name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libaom-dev libclang-dev pkg-config
      - name: Configure system libaom
        run: echo "LIB_AOM_STATIC_LIB_PATH=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV" && echo "LIB_AOM_INCLUDE_PATH=/usr/include" >> "$GITHUB_ENV" && echo "LIB_AOM_PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
      - run: cargo fmt -- --check
      - run: cargo check
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: cargo package --list --offline
