name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libclang-dev libheif-dev pkg-config
      - run: cargo fmt -- --check
      - run: cargo check
      - run: cargo test
      - run: cargo clippy -- -D warnings
