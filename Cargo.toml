[package]
name = "sphene"
version = "0.1.0"
edition = "2021"
authors = ["Algorithic Labs"]
description = "Memory-safe, ImageMagick-compatible image conversion CLI"
readme = "README.md"
repository = "https://github.com/algorithiclabs/sphene.git"
license = "MIT OR Apache-2.0"
keywords = ["image", "cli", "processing", "graphics", "bitmap"]
categories = ["command-line-utilities", "multimedia::images"]
exclude = ["AGENTS.md", "CLAUDE.md", "Dockerfile", "doc/"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
image = "0.25"
libavif-sys = { version = "0.17", default-features = false, features = ["codec-aom"] }
libheif-rs = "=1.0.2"
webp = "0.3.1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
